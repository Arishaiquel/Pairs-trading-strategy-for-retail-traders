<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pairs Trading Lab</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="bg-shape bg-shape-1"></div>
  <div class="bg-shape bg-shape-2"></div>

  <main class="container">
    <header class="hero">
      <h1>Pairs Trading Lab</h1>
      <p>Cointegration-first mean reversion backtesting with costs and slippage.</p>
    </header>

    <section class="panel controls">
      <div class="grid">
        <label>Ticker A <input id="ticker_a" value="KO" /></label>
        <label>Ticker B <input id="ticker_b" value="PEP" /></label>
        <label>Start <input id="start_date" type="date" value="2018-01-01" /></label>
        <label>End <input id="end_date" type="date" value="2026-01-01" /></label>
        <label>Lookback <input id="lookback" type="number" value="60" min="20" max="252" /></label>
        <label>Entry Z <input id="entry_z" type="number" value="2" step="0.1" /></label>
        <label>Exit Z <input id="exit_z" type="number" value="0" step="0.1" /></label>
        <label>Stop Z <input id="stop_z" type="number" value="3.5" step="0.1" /></label>
        <label>Cost (bps) <input id="cost_bps" type="number" value="5" step="0.5" /></label>
        <label>Slippage (bps) <input id="slippage_bps" type="number" value="2" step="0.5" /></label>
        <label>Capital <input id="capital" type="number" value="100000" min="1000" step="1000" /></label>
        <label class="checkbox-row"><input id="use_rolling_beta" type="checkbox" checked /> Use rolling beta</label>
      </div>
      <div class="actions">
        <button id="runBtn">Run Backtest</button>
        <button id="scanBtn" type="button">Scan Default Pairs</button>
        <select id="examplePairs"></select>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="metrics" id="metrics"></section>

    <section class="panel charts">
      <div class="chart-box"><canvas id="priceChart"></canvas></div>
      <div class="chart-box"><canvas id="spreadChart"></canvas></div>
      <div class="chart-box"><canvas id="zChart"></canvas></div>
      <div class="chart-box"><canvas id="equityChart"></canvas></div>
    </section>

    <section class="panel">
      <h2>Trades</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Side</th><th>Entry Date</th><th>Entry Z</th><th>Exit Date</th><th>Exit Z</th><th>Reason</th><th>Trade Return</th>
            </tr>
          </thead>
          <tbody id="tradeBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Pair Ranking</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Pair</th><th>Corr</th><th>Coint p</th><th>Half-life</th><th>Ann Return</th><th>Sharpe</th><th>Max DD</th>
            </tr>
          </thead>
          <tbody id="scanBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
